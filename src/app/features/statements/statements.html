<div class="statements-container">
  <div class="header">
    <div class="header-left">
      <h2>Statements</h2>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Account</mat-label>
        <mat-select [value]="selectedAccount()" (selectionChange)="selectedAccount.set($event.value)">
          @for (acc of accounts; track acc) {
            <mat-option [value]="acc">{{ acc }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    
    <button mat-raised-button color="primary" (click)="openUploadModal()">
      <mat-icon>upload_file</mat-icon>
      Upload Statement
    </button>
  </div>

  <table mat-table [dataSource]="statements()" class="mat-elevation-z1 statements-table">
    <!-- Period Column -->
    <ng-container matColumnDef="period">
      <th mat-header-cell *matHeaderCellDef> Statement Period </th>
      <td mat-cell *matCellDef="let element"> {{element.period}} </td>
    </ng-container>

    <!-- Account Column -->
    <ng-container matColumnDef="account">
      <th mat-header-cell *matHeaderCellDef> Account </th>
      <td mat-cell *matCellDef="let element"> {{element.account}} </td>
    </ng-container>

    <!-- Transactions Column -->
    <ng-container matColumnDef="transactions">
      <th mat-header-cell *matHeaderCellDef> Transactions </th>
      <td mat-cell *matCellDef="let element"> {{element.transactions}} </td>
    </ng-container>

    <!-- Pending Column -->
    <ng-container matColumnDef="pending">
      <th mat-header-cell *matHeaderCellDef> Pending </th>
      <td mat-cell *matCellDef="let element">
        <span [class.has-pending]="element.pending > 0">{{element.pending}}</span>
      </td>
    </ng-container>

    <!-- Approved Column -->
    <ng-container matColumnDef="approved">
      <th mat-header-cell *matHeaderCellDef> Approved </th>
      <td mat-cell *matCellDef="let element"> {{element.approved}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        <span class="status-chip" [ngClass]="element.status.toLowerCase().replace(' ', '-')">
          {{element.status}}
        </span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon>visibility</mat-icon>
            <span>View Transactions</span>
          </button>
          <button mat-menu-item>
            <mat-icon>download</mat-icon>
            <span>Download Statement</span>
          </button>
          <button mat-menu-item>
            <mat-icon>refresh</mat-icon>
            <span>Reprocess</span>
          </button>
          <button mat-menu-item (click)="approveAllPending(element)" [disabled]="element.pending === 0">
            <mat-icon>done_all</mat-icon>
            <span>Approve All Pending</span>
          </button>
          <button mat-menu-item class="danger-action" (click)="deleteStatement(element)">
            <mat-icon color="warn">delete</mat-icon>
            <span class="warn-text">Delete</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

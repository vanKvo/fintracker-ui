<div class="reports-container">
  <div class="header-actions">
    <h2 class="page-title">Financial Reports</h2>
    <div class="action-controls" style="display: flex; gap: 8px; align-items: center;">
      <mat-form-field appearance="outline" class="time-range-select" style="margin-bottom: -1.25em;">
        <mat-label>Time Range</mat-label>
        <mat-select [(value)]="selectedTimeRange">
          @for (range of timeRanges; track range.value) {
            <mat-option [value]="range.value">{{range.viewValue}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      
      <button mat-stroked-button color="primary">Export CSV</button>
      <button mat-stroked-button color="primary">Export PDF</button>
    </div>
  </div>

  <div class="reports-grid">
    <!-- Spending by Category (Pie Chart) -->
    <div class="data-card report-card">
      <div class="data-card-header">
        <h2 class="section-heading">Spending by Category</h2>
      </div>
      <div class="chart-content">
        <canvas baseChart
          [data]="categoryChartData"
          [options]="categoryChartOptions"
          [type]="'pie'">
        </canvas>
      </div>
    </div>

    <!-- Income vs Expenses Trend (Line Chart) -->
    <div class="data-card report-card">
      <div class="data-card-header">
        <h2 class="section-heading">Cashflow Trend</h2>
      </div>
      <div class="chart-content">
        <canvas baseChart
          [data]="trendChartData"
          [options]="trendChartOptions"
          [type]="'line'">
        </canvas>
      </div>
    </div>
  </div>

  <!-- Summary Stats Area for future implementation -->
  <div class="data-card summary-stats-card">
    <div class="data-card-header">
      <h2 class="section-heading">Period Summary</h2>
    </div>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Total Income</div>
        <div class="stat-value income-text">$8,450.00</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Total Expenses</div>
        <div class="stat-value expense-text">$3,240.50</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Net Savings</div>
        <div class="stat-value savings-text">$5,209.50</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Savings Rate</div>
        <div class="stat-value">61.6%</div>
      </div>
    </div>
  </div>
</div>
